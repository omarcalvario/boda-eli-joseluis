<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyección | Eli &amp; José Luis</title>
    <link rel="stylesheet" href="css/album.css">
</head>
<body class="projection-page">
    <main class="projection-stage" aria-label="Proyección de fotografías">
        <p class="projection-empty" id="projection-empty">Esperando fotografías aprobadas…</p>
        <img class="projection-photo" id="projection-photo" alt="Fotografía de la boda">
    </main>
    <nav class="projection-controls" aria-label="Controles de proyección">
        <button id="projection-fullscreen" type="button" aria-label="Alternar pantalla completa">Pantalla completa</button>
        <button id="projection-pause" type="button" aria-label="Pausar o continuar la proyección">Pausar</button>
        <a class="projection-album-link" href="album.html">Álbum</a>
    </nav>
    <script type="module" src="js/projection.js"></script>
</body>
</html>
